<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Invoice</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <th>#</th>
                <th>Item Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Milk</td>
                <td>25 baht</td>
                <td>3</td>
                <td>75 baht</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Banana</td>
                <td>10 baht</td>
                <td>3</td>
                <td>30 baht</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Bread</td>
                <td>25 baht</td>
                <td>3</td>
                <td>75 baht</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" align="right">Total</td>
                <td>180 baht</td>
            </tr>
        </tfoot>
    </table>

    <h1>Saving Money</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <th>Month</th>
                <th>Save Money</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td>100000</td>
                <td rowspan="3">300000</td>
            </tr>
            <tr>
                <td>February</td>
                <td>50000</td>
            </tr>
            <tr>
                <td>March</td>
                <td>150000</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
