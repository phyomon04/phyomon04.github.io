<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- This is p tag -->
    <p></p>
    <!-- This is p element -->
    <p>Hello</p>
    <div>
      <h1>Hello</h1>
    </div>

    <!-- Attribute -->
    <p align="right">This is p element 1</p>
    <p align="center">This is p element 2</p>
    <p align="left">This is p element 3</p>

    <!-- Global Attribute 
    Class and ID 
    -->

    <p class="p-class" id="p4">This is p element 4</p>
    <p class="p-class">This is p element 5</p>

    <!-- Case Insentive (many space between words)-->
    <h1>Hello</h1>
    <h1>Hi</h1>
    <p>Hello Welcome to My Website</p>

    <!-- uglly Code -->
    <div>
      <div>
        <h1>Title</h1>
        <p>This is paragraph</p>
      </div>
    </div>

    <!-- Pretty code -->
    <div>
      <div>
        <h1>Title 1</h1>
        <p>This is paragraph 1</p>
      </div>
      <div>
        <h1>Title 2</h1>
        <p>This is paragraph 2</p>
      </div>
    </div>
  </body>
</html>
