<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script>
      // operator
      //Assignment Operator (=)
      let x = 12;
      console.log(x);

      //Additional Operator (+)
      let three = 1 + 2;
      console.log(three);
      console.log(typeof three);
      let four = three + 1;
      console.log(four);
      let ThreeOne = "three" + 1;
      console.log(ThreeOne);
      console.log(typeof ThreeOne);
      let strNumber = "23" + "32";
      console.log(strNumber);
      console.log(typeof strNumber);
      let number = 5;
      number += 20; //number = number + 20
      console.log(number);

      //Substration Operators (-)
      let two = 3 - 1;
      console.log(two);
      let five = "6" - "1";
      console.log(five);
      let num = 25;
      num -= 5; //num = num - 5;
      console.log(num);

      //Division Operator (/)
      let div1 = 20 / 5;
      console.log(div1);
      let div2 = 20 / 7;
      console.log(div2);
      console.log(div2.toFixed(2));
      let div3 = 1 / 0;
      console.log(div3);
      let div = 20;
      div /= 4; //div = div / 4;
      console.log(div);

      // Remainder Operator (%)
      let rem1 = 20 % 5;
      console.log(rem1);
      let rem2 = 20 % 7;
      console.log(rem2);
      let rem3 = 1 % 0;
      console.log(rem3); //NaN -> Not a number
      let rem = 25;
      rem %= 2;
      console.log(rem);

      //Multiplication operator (*)
      let mul1 = 12 * 12;
      console.log(mul1);
      let mul2 = -12 * 12;
      console.log(mul2);
      let mul = 5;
      mul *= 25; //mul = mul * 25;
      console.log(mul);

      //Exponentiation operator
      let exp1 = 2 ** 2;
      console.log(exp1);
      let exp2 = 4 ** 6; // 4 x 4 x 4 x 4 x 4 x 4
      console.log(exp2);

      //precendence
      // * / %
      // + -
      // =
      let total = 1 * 2 + ((5 / 2) % 2);
      console.log(total);

      // Comparisons operator
      let n = 12;
      let m = '12';
      console.log(n < 5);
      console.log(n < 15);
      console.log(n < 12);
      console.log(n < 21);

      console.log(n > 17);
      console.log(n > 7);
      console.log(n >= 12);
      console.log(n >= 2);

      console.log(12 == 12);
      console.log(n == m);
      console.log(n === m);

      console.log(n != m);
      console.log(n !== m);

      // Logical Operator
      // AND  && 
      // OR   ||
      // NOT  !

      console.log(13 < 14 && 15 > 11 && 10 > 5);
                  //  true && true && true
                  // 1 x 1 x 1
      
      console.log(23 < 11 || 21 > 31 || 1 < 10);
                  // false || fallse || true
                  // 0 + 0 + 1
   
      
    </script>
  </head>
  <body></body>
</html>
