<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        // Condition 
        // if 
        let number = 2;
        if (number > 0) {
            document.write("<h1>Number is greater than Zero.</h1>");
        }

        // if else
        let num = -5;
        if (num > 0) {
            document.write("<h1>Num is greater than Zero.</h1>");
        }else {
            document.write("<h1>Num is less than Zero.</h1>");
        }

        // if , else if , else

        let n = prompt("Enter a number");
        console.log(n);
        if (n > 0) {
            document.write("<h1>n is greater than Zero.</h1>");
        }else if (n < 0) {
            document.write("<h1>N is less than Zero.</h1>");
        }else if (n == 0) {
            document.write("<h1>N is equal to Zero.</h1>");
        }else {
            document.write("<h1>N is NOT a Number.</h1>");
        }
        
    </script>
</head>

</html>
