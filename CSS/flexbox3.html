<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            background-color: black;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            color: white;
        }

        .brand {
            text-decoration: none;
            font-size: 1.5rem;
            color: white;
        }

        .nav-link {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-link li a {
            text-decoration: none;
            font-size: 1rem;
            color: white;
        }

        .nav-link li a:hover {
            color: red;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="" class="brand">Hein Learn</a>
        <ul class="nav-link">
            <li><a href="">Home</a></li>
            <li><a href="">Services</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
