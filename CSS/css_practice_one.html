<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
        p {
            color: brown;
        }
        .box {
            border: 1px solid red;
            width: 300px;
            height: 100px;
            
            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.3s;
        }

        .box:hover {
            color: green;
            font-size: 20px;
            cursor: pointer;
        }
        
    </style>
  </head>
  <body>
    <p class="box">Box 1</p>
    <p class="box">Box 2</p>
    <p class="box">Box 3</p>
  </body>
</html>
