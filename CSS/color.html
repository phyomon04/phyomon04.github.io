<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            margin: 30px;
            padding: 100px;
            border: 1px solid black;
            text-align: center;
        }

        .color1 {
            color: rgb(249, 139, 4);
            background-color: #fff;
        }

        .color2 {
            background-color: rgb(255, 0, 255);
            opacity: 0.3;
        }

        .color3 {
            background-color: rgba(0, 255, 255, 1);
        }
    </style>

</head>
<body>
    <div class="color1">Colr1</div>
    <div class="color2">Colr2</div>
    <div class="color3">Colr3</div>
</body>
</html>
